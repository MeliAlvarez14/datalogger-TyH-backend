services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqttDatalogger
    ports:
      - "1883:1883"  
      - "9001:9001"   
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: influx_db
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=inti_lab
      - DOCKER_INFLUXDB_INIT_BUCKET=corrosion_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mi-token-secreto-123

volumes:
  influxdb_data:
  influxdb_config:
